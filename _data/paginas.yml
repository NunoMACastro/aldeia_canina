# Navegação e faixa de paisagem de cada página, pela ordem da barra superior.
# url: endereço da página no site; md: ficheiro de origem no repositório.
# figura: chave em _data/figuras.yml (legenda e texto alternativo).
# faixa / faixa_estreita: recortes próprios de cada entidade, tirados das imagens
# originais (images/aerial.png e images/view.png) e escolhidos pelo assunto da
# entidade; a estreita serve o telemóvel e os postais. Sem faixa, usa-se a figura.
# foco_x/foco_y/zoom: enquadramento da imagem dentro da faixa.

- url: /
  md: README.md
  curto: Apresentação
  nome: Apresentação do projeto
  figura: aerea
  foco_x: 50%
  foco_y: 45%
  zoom: 1

