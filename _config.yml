# Site da Aldeia Canina Sustentável em Viseu, publicado com GitHub Pages (Jekyll).
# O conteúdo vem só dos ficheiros Markdown (README.md e entidades/*.md), que
# continuam a ler-se no GitHub sem cabeçalhos extra. Este ficheiro, o layout,
# os dados em _data/ e os estilos tratam apenas da apresentação.

title: Aldeia Canina Sustentável em Viseu
lang: pt-PT

# Textos de enquadramento repetidos em todas as páginas. «versao» e «natureza» são
# cópias literais do README.md (primeira linha e secção «Sobre este documento»); se o
# README mudar, mudam também. «natureza» serve a descrição da página; na caixa
# «Documento preliminar» vai «natureza_curta», a mesma frase sem repetir o título,
# que acompanha «natureza» quando esta mudar.
versao: "Versão 1.0, de 3 de novembro de 2026."
natureza: "Este documento preliminar apresenta o projeto antes de escolhermos o terreno; não é projeto de execução nem pedido formal."
natureza_curta: "Preparado antes de escolhermos o terreno; não é projeto de execução nem pedido formal."
# Título da página de entrada no site: a primeira frase do README.
titulo_entrada: "Apresentação do projeto às entidades"
# Nome na barra superior, o único sítio do site onde aparece.
nome_barra: "Projeto Aldeia Canina Sustentável em Viseu"
# Contactos no rodapé, indicados pelo utilizador a 2026-11-04.
contacto_telefone: "966 182 433"
contacto_email: "mariajpsousa@icloud.com"

markdown: kramdown
kramdown:
  input: GFM
  auto_ids: true
  hard_wrap: false

# Plugins que o GitHub Pages já traz: páginas sem front matter, README como
# página de entrada, ligações .md convertidas e título tirado do primeiro H1.
plugins:
  - jekyll-optional-front-matter
  - jekyll-readme-index
  - jekyll-relative-links
  - jekyll-default-layout
  - jekyll-titles-from-headings

titles_from_headings:
  enabled: true
  strip_title: true

defaults:
  - scope:
      path: ""
    values:
      layout: default

# Ficheiros internos e de trabalho que não fazem parte do site.
exclude:
  - PRODUCT.md
  - DESIGN.md
  - prototipo-site
  - Gemfile
  - Gemfile.lock
  - vendor
