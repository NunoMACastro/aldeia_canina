# Navegação e imagem de abertura de cada página, pela ordem da barra superior.
# url: endereço da página no site; md: ficheiro de origem no repositório.
# figura: chave em _data/figuras.yml. A figura dá a imagem da abertura e do
# postal, a legenda e o texto alternativo; cada entidade abre com a figura do
# README mais próxima do seu assunto.
# foco_x/foco_y/zoom: enquadramento da imagem dentro da abertura e do postal.

- url: /
  md: README.md
  nome: Apresentação do projeto
  figura: aerea
  foco_x: 50%
  foco_y: 35%
  zoom: 1

